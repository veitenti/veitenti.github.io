<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=https://pixelpatterns.itch.io/">
  <title>Redirecting…</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .redirect-box {
      background: #fff;
      border-radius: 1em;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      padding: 2em 3em;
      text-align: center;
    }

    a {
      color: #da392a;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    window.onload = function () {
      window.location.replace('https://pixelpatterns.itch.io/');
    };
  </script>
</head>

<body>
  <div class="redirect-box">
    <h1>Redirecting…</h1>
    <p>If you are not redirected automatically, <a href="https://pixelpatterns.itch.io/">click here</a>.</p>
  </div>
</body>

</html>
