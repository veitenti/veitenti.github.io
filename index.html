<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Patterns</title>
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>
        <img src="assets/icon.png" alt="Logo of Pixel Patterns" />
        <span>Pixel Patterns</span>
      </h1>
      <nav>
        <a href="#start">Start</a>
        <a href="#games">Games</a>
        <a href="#about">About</a>
      </nav>
    </header>

    <section id="start">
      <div id="intro">
        <h1>Pixel Patterns</h1>
        <p>creates fun video games that can be played on any device.</p>
      </div>
    </section>

    <section id="games">
      <div id="game-tiles">
        <a href="https://pixelpatterns.itch.io/snowfall" target="_blank">
          <div id="ipa" class="game-tile">
            <h3>Ice Peak Adventure</h3>
            <p>Like skiing but with your keyboard</p>
          </div>
        </a>
        <a href="https://pixelpatterns.itch.io/out-of-space" target="_blank">
          <div id="oos" class="game-tile">
            <h3>Out of Space</h3>
            <p>Fast-paced endless runner in SPACE!</p>
          </div>
        </a>
      </div>
    </section>

    <section id="about">Creating video games just for fun :D</section>

    <footer>
      <div>
        <span>© 2025 Pixel Patterns</span>
      </div>
    </footer>
  </body>
</html>
